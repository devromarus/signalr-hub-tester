# =============================================================================
# SignalR Hub Tester — конфигурация nginx
# Статическая раздача SPA с fallback на index.html.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip-сжатие статических ассетов.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Кэширование хешированных ассетов (Vite добавляет хеш в имена файлов).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon и прочие статические файлы из public/.
    location ~* \.(svg|png|ico|webp|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: все несуществующие пути отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}